{% extends "base.html" %}

{% block title %}Page Not Found | Portfolio{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center px-4 py-24 bg-[#0A0A0E] text-white">
    <div class="text-center rounded-[2rem] border border-[#00E5FF]/15 bg-[#07070b]/95 p-16 shadow-[0_30px_80px_rgba(0,229,255,0.12)]">
        <h1 class="text-6xl font-bold text-[#9D4EDD] mb-4">404</h1>
        <p class="text-2xl text-slate-200 mb-8">Page Not Found</p>
        <p class="text-slate-400 mb-12 max-w-md mx-auto">The page you're looking for doesn't exist. Let's get you back on track with a cleaner, more powerful project showcase.</p>
        <a href="{{ url_for('home') }}"
            class="inline-block rounded-full bg-[#00E5FF] px-8 py-3 text-sm font-semibold uppercase tracking-[0.15em] text-[#0A0A0E] hover:bg-[#00c6e0] transition shadow-[0_15px_40px_rgba(0,229,255,0.25)]">
            Return Home
        </a>
    </div>
</div>
{% endblock %}

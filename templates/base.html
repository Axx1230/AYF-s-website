<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Freelance backend and automation portfolio for Python and Java solutions. Business-focused projects, APIs, and ready-to-deploy code examples.">
    <title>{% block title %}Anas Yusuf Farhan | Portfolio{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="{% block body_class %}bg-[#0A0A0E] text-white font-sans antialiased flex flex-col min-h-screen{% endblock %}">

    <!-- Navigation -->
    {% include 'components/navigation.html' %}

    <!-- Main Content -->
    <main class="flex-grow {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'components/footer.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/apps.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
